<!-- toast.component.html -->

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080; width: 320px;">

  @for (toast of toastService.toasts(); track toast.id) {

    <div
      class="alert d-flex justify-content-between align-items-start shadow mb-2 animate-slide-in"
      [ngClass]="{
        'alert-success': toast.type === 'success',
        'alert-danger': toast.type === 'error',
        'alert-info': toast.type === 'info',
        'alert-warning text-dark': toast.type === 'warning'
      }"
      role="alert"
    >

      <div class="me-2">
        {{ toast.message }}
      </div>

      <button
        type="button"
        class="btn-close ms-2"
        aria-label="Close"
        (click)="toastService.remove(toast.id)"
      ></button>

    </div>

  }

</div>
